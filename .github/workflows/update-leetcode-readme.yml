name: Update LeetCode Progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update LeetCode Progress') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean README
        run: |
          python - <<'PY'
          import os
          import re

          folders = []
          for name in os.listdir('.'):
              if os.path.isdir(name) and re.fullmatch(r'\d{4}-[a-z0-9-]+', name):
                  number, slug = name.split('-', 1)
                  folders.append((int(number), slug, name))

          folders.sort(key=lambda x: x[0])

          lines = [
              '# LeetCode Problems & Solutions',
              '',
              '| # | Problem | Solution |',
              '|---:|---|---|',
          ]

          for number, slug, folder in folders:
              title = slug.replace('-', ' ').title()
              title = re.sub(r'\b2d\b', '2D', title, flags=re.I)
              lines.append(f'| {number} | {title} | [View Solution](./{folder}) |')

          lines += [
              '',
              'All accepted LeetCode solutions are added automatically.',
              ''
          ]

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          PY

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo 'README is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update LeetCode Progress'
          git push
