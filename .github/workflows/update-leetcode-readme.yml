name: Update LeetCode Progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update LeetCode Progress') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing LeetHub problems to README
        run: |
          python - <<'PY'
          import os, re, subprocess
          from datetime import datetime

          if not os.path.exists('README.md'):
              raise SystemExit('README.md not found')

          with open('README.md', encoding='utf-8') as f:
              readme = f.read()

          existing = {int(x) for x in re.findall(r'\*\*(\d+)\.\s', readme)}

          # Scan the repository itself instead of only the latest commit.
          # This handles LeetHub's multiple commits for one submission.
          folders = []
          for name in os.listdir('.'):
              if os.path.isdir(name) and re.fullmatch(r'\d{4}-[a-z0-9-]+', name):
                  folders.append(name)

          missing = []
          for folder in sorted(folders):
              number, slug = folder.split('-', 1)
              n = int(number)
              if n not in existing:
                  missing.append((n, slug, folder))

          if not missing:
              print('README already contains all LeetHub problems.')
              raise SystemExit(0)

          # Number new entries after the existing chronological entries.
          entry_count = len(re.findall(r'^\|\s*\d+\s*\|', readme, re.MULTILINE))
          date_text = datetime.now().strftime('%b %-d, %Y')
          rows = []
          for i, (n, slug, folder) in enumerate(missing, start=1):
              title = slug.replace('-', ' ').title()
              title = re.sub(r'\b2d\b', '2D', title, flags=re.I)
              rows.append(f'| {entry_count + i} | **{n}. {title}** | {date_text} |')

          marker = '\n> **Note:**'
          if marker in readme:
              pos = readme.find(marker)
              readme = readme[:pos].rstrip() + '\n' + '\n'.join(rows) + '\n' + readme[pos:]
          else:
              readme = readme.rstrip() + '\n' + '\n'.join(rows) + '\n'

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme)
          PY

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo 'No README changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update LeetCode Progress'
          git push
